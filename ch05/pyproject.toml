[project]
name = "ch05"
version = "0.1.0"
requires-python = ">=3.12, <3.14"
dependencies = [
    "accelerate>=1.14.0",
    "datasets[audio]<4.0.0",
    "langchain>=1.3.16",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "librosa>=1.0.0",
    "load-dotenv>=0.1.0",
    "numpy>=1.26",
    "openai>=3.3.1",
    "pyannote-audio>=4.0.0",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers<=4.48.3",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
